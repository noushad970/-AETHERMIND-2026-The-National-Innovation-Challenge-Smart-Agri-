name: ai_agri_assistant
description: "AI-powered agriculture assistant for Bangladesh farmers"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2

  # Networking
  http: ^1.2.2
  http_parser: ^4.1.0
  connectivity_plus: ^6.1.3

  # Google Gemini AI
  google_generative_ai: ^0.4.7

  # Image picking for disease detection
  image_picker: ^1.1.2


  # Voice input & output
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0


  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Location & Maps
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Permissions
  permission_handler: ^11.3.1

  # Utility
  intl: ^0.20.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
  web:
    generate: true
    image_path: "assets/app_logo.png"
    background_color: "#ffffff"
    theme_color: "#0F5C4A"

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png
    - assets/data/
    - assets/images/
    - assets/audio/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
          weight: 700
